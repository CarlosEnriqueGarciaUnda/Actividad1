<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar edad para votar</title>
    <style>
        body{
            font-family: arial,sans-serif;
            background-color: #ffffff;
            padding: 50px;
            color: #333333;
        }

        .calculadora{
            background: #ffffff;
            padding: 30px;
            max-width: 300px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgb(0, 0, 0,0.1);
            border: 1px solid #2e28f0;
        }

        h2{
            color: #0284c7;
            margin-top: 0;
            text-align: center;
        }

        label{
            font-size: 14px;
            color: #475569;
            font-weight: bold;
        }

        input{
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            color: #0f172a;
            font-size: 14px;
        }

        input:focus{
            border-color: #0284c7;
            outline: none;
        }

        button{
            width: 100%;
            padding: 11px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: background-color 0.2px;
        }

        button:hover{
            background-color: #0368ec;
        }

        .readonly-input{
            background-color: #f1f5f9;
            color: #0f172a;
            font-weight: bold;
            cursor: not-allowed;
            border-color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="Mi Calculadora">
        <h2>Edad para el voto</h2>
        <h2>Elegibilidad de Voto</h2>
        <label for="edad">Ingresa tu edad:</label>
        <input type="number" id="edad" placeholder="Ej: 20" min="1" step="1">

        <button id="btnVerificar">Verificar</button>

        <label for="resultado" style="margin-top: 15px; display: block;">Estado de elegibilidad:</label>
        <input type="text" id="resultado" class="readonly-input" readonly placeholder="El resultado aparecerá aquí">
    </div>

    <script src="js/ejercicio13.js"></script>

</body>
</html>
