<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetas: tacos al pastor</title>
</head>
<body>
    <h1>Tacos al pastor caseros</h1>
    <h2>Ingredientes: </h2> 
    <ul>
        <li>Carne de cerdo (500 gr)</li>
        <li>Piña (1 taza)
            <ul>
                <il>Cortes en cubos</il>
            </ul>
        </li>
        <li>Tortilla de maiz</li>
    </ul>
    <h2>Preparacion: </h2>
    <ol>
        <li>Marinar la carne por dos horas.</li>
        <li>Asar a fuego medio.</li>
    </ol>
    <p>Servir con cilantro y cebolla</p>
</body>
</html>
